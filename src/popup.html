<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WA Automation</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>WA Automation</h1>
    <p id="summary">Loading…</p>

    <label>
      <input id="enabled" type="checkbox" />
      <span>Enabled</span>
    </label>

    <label>
      <input id="autoSend" type="checkbox" />
      <span>Auto-send</span>
    </label>

    <label>
      <input id="awayMode" type="checkbox" />
      <span>Away mode</span>
    </label>

    <button id="diagnose" type="button" class="secondary">Diagnose current chat</button>
    <button id="testWriter" type="button" class="secondary">Test WhatsApp writer</button>
    <button id="options" type="button">Open settings</button>
    <p id="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
